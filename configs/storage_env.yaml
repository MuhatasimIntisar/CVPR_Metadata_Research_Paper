# storage_env: professor's PC. Full download + ingest, long-term home of the shards.
env_name: storage_env
data_root: D:/cvpr_metadata_data   # TODO: set to the real storage drive

discovery:
  n_videos: 1000                  # default target if --n-videos is not given
  oversample: 1.4                # search for 40% extra: some videos fail ingest
  queries_per_batch: 40
  results_per_query: 8           # cap per query
  max_per_channel: 15            # cap per YouTube channel (avoid one broadcaster dominating)
  max_per_combo: 12              # ceiling per action|place|location combo (even coverage)
  alpha: 1.0                     # how strongly to favour under-filled combos
  max_batches: 200
  seed: 0
  sleep_between_searches_s: 2
  min_duration_s: 60
  max_duration_s: 3600

ingest:
  videos_per_shard: 100
  max_height: 480
  keep_audio: true
  delete_raw: true
  sleep_between_downloads_s: 5

segmentation:
  detector: pyscenedetect
  threshold: 27.0
  min_shot_s: 1.5
  max_shot_s: 20.0

filters:
  phash_max_distance: 6

keyframes:
  per_shot: 1
  max_side: 384
  jpeg_quality: 85

annotation:
  device: cpu
