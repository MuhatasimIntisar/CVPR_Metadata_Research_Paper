# test_env: your laptop. Tiny batches, CPU only, everything self-contained in the repo.
env_name: test_env
data_root: data/test_env          # relative paths are resolved from the repo root

# Search terms file in configs/. Switch to search_pools.expanded.yaml once reviewed.
search_pools: search_pools.yaml

discovery:
  n_videos: 10                  # default target if --n-videos is not given
  oversample: 1.4                # search for 40% extra: some videos fail ingest
  queries_per_batch: 4
  results_per_query: 3           # cap per query
  max_per_channel: 3            # cap per YouTube channel (avoid one broadcaster dominating)
  max_per_combo: 2              # ceiling per action|place|location combo (even coverage)
  alpha: 1.0                     # how strongly to favour under-filled combos
  max_batches: 10
  seed: 0
  sleep_between_searches_s: 1
  min_duration_s: 60
  max_duration_s: 1500

ingest:
  videos_per_shard: 3
  max_height: 480                 # download + clip resolution
  keep_audio: true
  delete_raw: true                # delete full downloads once the shard is written
  sleep_between_downloads_s: 2

segmentation:
  detector: pyscenedetect         # TransNetV2 planned for live
  threshold: 27.0
  min_shot_s: 1.5
  max_shot_s: 20.0                # longer shots are split into equal chunks

filters:
  phash_max_distance: 6           # near-duplicate threshold (Hamming distance)

keyframes:
  per_shot: 1
  max_side: 384
  jpeg_quality: 85

annotation:
  device: cpu
