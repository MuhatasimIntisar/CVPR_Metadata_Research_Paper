# Single source of truth for the 12 metadata fields and their allowed values.
# Every stage (discovery queries, annotators, fusion, query generation) reads from here.
# "unknown" is always a valid value and is not listed.

dimensions:
  location:
    L1_environment: [indoor, outdoor, natural]
    L2_place_type: [street, studio, office, park, venue, residential, transport, waterfront]
    L3_named_location: open          # free text (city / landmark), normalised later
  time:
    L1_illumination: [day, night]
    L2_daypart: [morning, midday, evening, night]
    L3_time_estimate: open           # approximate window or date, with confidence
  action:
    L1_activity_family: [movement, communication, work, leisure]
    L2_specific_action: [walking, running, dancing, presenting, interviewing, protesting, cooking, playing_sport, driving, celebrating]
    L3_interaction: [person_person, person_object, group, none]
  cinematography:
    L1_shot_scale: [close, medium, wide]
    L2_camera_motion: [static, pan, tilt, zoom, tracking, handheld]
    L3_viewpoint: [eye_level, aerial, high_angle, low_angle, pov]

# Search terms for discovery live in configs/search_pools.yaml (kept separate on purpose:
# the taxonomy is the fixed label schema; search pools can change between collection runs).
