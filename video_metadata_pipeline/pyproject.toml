[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "video-metadata-pipeline"
version = "0.1.0"
description = "Human-in-the-loop video metadata construction for video corpus moment retrieval"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2.3", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
level1 = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.33", "ultralytics>=8.3", "silero-vad>=5.1",
          "opencv-python-headless>=4.8", "scenedetect>=0.6.4", "easyocr>=1.7", "speechbrain>=1.0",
          "scikit-learn>=1.3", "soundfile>=0.12", "scipy>=1.10"]
dev = ["pytest>=7"]

[project.scripts]
vmp = "video_metadata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
